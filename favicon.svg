<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient Premium -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
  </defs>
  
  <!-- Kotak Background Membulat -->
  <rect width="512" height="512" rx="130" fill="url(#bg)"/>
  
  <!-- Teks "M." menggunakan font bawaan sistem agar pasti terbaca -->
  <text x="50%" y="50%" font-family="Georgia, 'Times New Roman', serif" font-size="280px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central" dy="15">
    M<tspan fill="#f472b6">.</tspan>
  </text>
</svg>
